# dependabot.yml
#
# Documentation:
#   https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Dependabot for CI
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/otdfctl/e2e"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"

  # Dependabot for internal deps
  # Add explicit entry as any go.mods need internal dep checks

  # BDD tests
  - package-ecosystem: gomod
    directories:
      - "/tests-bdd"
    commit-message:
      prefix: "fix(deps)"
    groups:
      external:
        exclude-patterns:
          - "github.com/opentdf/*"
    # Internal bumps fan out across directories and overflow the default of 5.
    open-pull-requests-limit: 15
    schedule:
      interval: daily

  # Published and deployed modules: version updates only for internal
  # (github.com/opentdf/*) deps. External deps are left alone to avoid raising
  # the minimum versions seen by downstream consumers.
  - package-ecosystem: gomod
    directories:
      - "/lib/fixtures"
      - "/lib/flattening"
      - "/lib/identifier"
      - "/lib/ocrypto"
      - "/sdk"
      - "/service"
      - "/otdfctl"
      - "/protocol/go"
    commit-message:
      prefix: "fix(deps)"
    allow:
      - dependency-name: "github.com/opentdf/*"
      # An `allow` name also filters security updates, so this rule matches
      # every dep to keep security PRs for vulnerable external deps. Its
      # update-types only applies to version updates, limiting external deps
      # to major bumps, which Go modules rarely get without a path change.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Offer our own releases on the next run instead of after the default
    # 3-day cooldown.
    cooldown:
      exclude:
        - "github.com/opentdf/*"
    # Internal bumps fan out across directories and overflow the default of 5.
    open-pull-requests-limit: 15
    schedule:
      interval: daily
