name: GitHub actions unit tests

on:
  pull_request:
    paths:
      - '.github/actions/**'

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Test JavaScript actions
        run: node --test .github/actions/*.test.cjs
