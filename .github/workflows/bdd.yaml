name: BDD tests

on:
  workflow_call:
    inputs:
      scale:
        description: Run the report-only authorization scale suite
        type: boolean
        default: false

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          # Remove containerd if present to prevent conflict
          sudo apt-get remove -y containerd containerd.io || true
          sudo apt-get install -y curl docker.io docker-compose-v2 lsof coreutils libnss3-tools
          curl -JLO "https://dl.filippo.io/mkcert/latest?for=linux/amd64"
          chmod +x mkcert-v*-linux-amd64
          sudo cp mkcert-v*-linux-amd64 /usr/local/bin/mkcert

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.work
          cache: false
      - name: Locate Go caches
        id: go-cache-paths
        run: |
          {
            echo "modules=$(go env GOMODCACHE)"
            echo "build=$(go env GOCACHE)"
            echo "version=$(go env GOVERSION)"
          } >> "$GITHUB_OUTPUT"
      - name: Restore Go caches
        id: go-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.modules }}
            ${{ steps.go-cache-paths.outputs.build }}
          key: bdd-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-paths.outputs.version }}-${{ hashFiles('**/go.sum') }}

      - name: Test authorization summary renderer
        if: ${{ !inputs.scale }}
        run: python3 -m unittest discover -s .github/scripts -p 'test_summarize_authz_performance.py'

      - name: Compile BDD test suite
        run: go test -c -tags=cukes -o "$RUNNER_TEMP/bdd-tests" ./tests-bdd

      - name: Build local platform-cukes image for testing
        run: docker build -t platform-cukes .

      - name: Run BDD Tests
        id: bdd
        shell: bash
        env:
          SCALE: ${{ inputs.scale }}
          GODOG_TAGS: ${{ inputs.scale && '@scale' || '~@scale' }}
        run: |
          test_args=()
          if [[ "$SCALE" == "false" ]]; then
            test_args+=(--godog.random)
          fi
          CUKES_LOG_HANDLER=console go test ./tests-bdd -count=1 -v -timeout=20m --tags=cukes "${test_args[@]}" --godog.tags="$GODOG_TAGS" --godog.format="cucumber:$(pwd)/cukes_platform_report.json,pretty:$(pwd)/cukes_platform_report.log,pretty" ./features 2>&1 | tee cukes_test_output.log

      - name: Summarize authorization performance
        if: ${{ !cancelled() && inputs.scale }}
        env:
          BDD_OUTCOME: ${{ steps.bdd.outcome || 'skipped' }}
        run: |
          python3 .github/scripts/summarize-authz-performance.py cukes_test_output.log --bdd-outcome "$BDD_OUTCOME" | tee authorization_scale_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Check for undefined steps
        run: |
          if grep -qi "Undefined" cukes_platform_report.log; then
            echo "Undefined steps found in BDD tests!"
            exit 1
          fi

      - name: Get logs on failure
        if: failure() || cancelled()
        run: |
          cat cukes_platform_compose.log
          docker ps -aq | xargs -L 1 docker logs
          cat cukes_platform_service.log
      - uses: actions/upload-artifact@0b2256b8c012f0828dc542b3febcab082c67f72b # v4.3.4
        if: ${{ !cancelled() }}
        with:
          name: ${{ inputs.scale && 'authorization-scale-report' || 'cukes-report' }}
          path: |
            cukes_platform_report.json
            cukes_platform_report.log
            cukes_test_output.log
            cukes_platform_compose.log
            cukes_platform_service.log
            authorization_scale_summary.md
          retention-days: 1

      # PR runs restore only. A successful functional suite on main owns cache saves.
      - name: Save Go caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.scale && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.modules }}
            ${{ steps.go-cache-paths.outputs.build }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
