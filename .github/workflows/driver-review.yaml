name: Driver review attestation

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] privileged metadata/status writes use only default-branch helper; never execute PR code
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: driver-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  attestation:
    if: github.event_name == 'pull_request_target' || (github.event.issue.pull_request && github.event.comment.body == '/reviewed')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
      statuses: write
    steps:
      # The event's repository default branch is trusted; never check out the PR head/merge ref.
      # Until this helper is merged into that branch, this workflow cannot bootstrap on this PR.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { run } = require('./.github/actions/driver-review.js');
            await run({ github, context });
