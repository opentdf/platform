# Generates connect-go v2 service stubs for platform services. Messages and the
# v1 stubs in protocol/go come from buf.gen.yaml; these stubs import those
# messages and live in the service module until protocol/go publishes v2 stubs.
version: v2
managed:
  enabled: true
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: github.com/opentdf/platform/protocol/go
plugins:
  # The v2 plugin shares the v1 binary name, so run it by version.
  - local: ["go", "run", "connectrpc.com/connect/v2/cmd/protoc-gen-connect-go@v2.0.0"]
    out: service/internal/connectv2
    opt:
      - paths=source_relative
      - package_suffix=connectv2
